services:
  transfer:
    build: .
    container_name: transfer
    restart: unless-stopped
    environment:
      # WEBHOOK_TOKEN 在 .env 里设置，用于 BUG反馈房间的外部 API 调用
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:?请先在 .env 里设置 WEBHOOK_TOKEN}
      # 走 nginx HTTPS 反代时开启（cookie 带 Secure 标记）
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
    ports:
      # 只绑本机回环，不直接暴露公网，由 nginx 反代对外提供服务
      - "127.0.0.1:8787:8787"
    volumes:
      # 数据库、上传文件、备份都在这个目录里，换机器拷走即可迁移
      - ./data:/app/data
